name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Metadata
        run: npm run docgen
      - name: dist/ and metadata/ are up to date
        run: |
          if [ -n "$(git status --porcelain -- dist metadata)" ]; then
            echo "::error::dist/ or metadata/ differ from the sources. Run npm run build && npm run docgen and commit the result."
            git status --short -- dist metadata
            git diff --stat -- dist metadata
            exit 1
          fi

  # the oldest ForgeScript the peer range (^2) allows; 2.2 and 2.4 also pass
  forgescript-2-0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm i --no-save --ignore-scripts @tryforge/forgescript@2.0.0
      - run: npm test
